apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: India
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
    containers:
      - name: frontend
        image: nginx:latest
        ports:
        - containerPort: 80